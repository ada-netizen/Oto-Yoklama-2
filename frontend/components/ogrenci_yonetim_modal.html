<div class="modal-overlay" id="ogrenci_yonetim_modal" x-data="ogrenciYonetimComponent()" @ogrenciler-guncellendi.window="arama = arama; /* re-trigger reactivity */">
<div class="modal-content" style="width: 880px; max-width: 95vw; max-height: 90vh; display: flex; flex-direction: column; padding: 0; background-color: var(--bg-main); border-radius: var(--radius-lg); overflow: hidden;">
<div class="modal-header" style="padding: 16px 20px; border-bottom: 1px solid var(--border); background-color: var(--bg-card-solid); display: flex; justify-content: space-between; align-items: center;">
<h2 style="margin:0; color: #38BDF8; font-size: 16px; font-weight: 700; display:flex; align-items:center; gap:8px;">
<i data-lucide="graduation-cap" height="18" width="18"></i> Öğrenci Veritabanı Yönetimi
</h2>
<button class="btn btn-temizle" onclick="modalKapat('ogrenci_yonetim_modal')" style="padding: 6px 12px; font-size: 12px; display:flex; align-items:center; gap:4px;"><i data-lucide="x" height="14" width="14"></i> Kapat</button>
</div>
<div style="padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; background: var(--bg-card); border-bottom: 1px solid var(--border);">
<div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
<div class="input-with-icon" style="width: 260px;">
<i data-lucide="search" class="search-icon"></i>
<input class="search-input" x-model="arama" placeholder="Öğrenci Ara (Ad veya No)..." type="text"/>
</div>
<div style="display: flex; gap: 6px;">
    <select x-model="aktifFiltre" style="padding: 7px 12px; background: var(--bg-main); color: var(--fg-main); border: 1px solid var(--border); border-radius: var(--radius-sm); outline: none; font-size: 12px; cursor: pointer;">
        <option value="Tümü">Tüm Sınıflar</option>
        <template x-for="sube in subeler" :key="sube">
            <option :value="sube" x-text="sube"></option>
        </template>
    </select>
</div>
</div>
<div style="display: flex; gap: 10px;">
<button class="btn btn-ogr" @click="yeniEkle()" style="padding: 7px 16px; border-radius: var(--radius-sm); display:flex; align-items:center; gap:6px;"><i data-lucide="user-plus" height="15" width="15"></i> Yeni Öğrenci Ekle</button>
</div>
</div>

<!-- Duzenleme / Ekleme Formu -->
<div x-show="formAcik" style="padding: 16px 20px; background-color: var(--bg-card-solid); border-bottom: 1px solid var(--border);">
    <h3 style="margin-top:0; color: var(--fg-main); font-size: 14px; font-weight:700;" x-text="duzenlenenOgrenci.eski_no ? 'Öğrenciyi Düzenle' : 'Yeni Öğrenci Ekle'"></h3>
    <div style="display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap;">
        <div style="display: flex; flex-direction: column; gap: 5px;">
            <label style="font-size: 11px; font-weight:600; color: var(--fg-sub);">Okul No</label>
            <input type="text" x-model="duzenlenenOgrenci.no" class="input-modern" style="width: 100px; padding: 7px; background:var(--bg-main); color:var(--fg-main); border:1px solid var(--border); border-radius:var(--radius-sm);">
        </div>
        <div style="display: flex; flex-direction: column; gap: 5px;">
            <label style="font-size: 11px; font-weight:600; color: var(--fg-sub);">Ad Soyad</label>
            <input type="text" x-model="duzenlenenOgrenci.ad_soyad" class="input-modern" style="width: 250px; padding: 7px; background:var(--bg-main); color:var(--fg-main); border:1px solid var(--border); border-radius:var(--radius-sm);">
        </div>
        <div style="display: flex; flex-direction: column; gap: 5px;">
            <label style="font-size: 11px; font-weight:600; color: var(--fg-sub);">Sınıfı</label>
            <input type="text" x-model="duzenlenenOgrenci.sube" class="input-modern" style="width: 100px; padding: 7px; background:var(--bg-main); color:var(--fg-main); border:1px solid var(--border); border-radius:var(--radius-sm);">
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="btn btn-dev" @click="kaydet()" style="padding: 7px 16px;"><i data-lucide="check" height="14" width="14"></i> Kaydet</button>
            <button class="btn btn-temizle" @click="formAcik = false" style="padding: 7px 14px;">İptal</button>
        </div>
    </div>
</div>

<div class="tree-card" style="margin: 16px 20px; flex: 1; border: 1px solid var(--border); overflow-y: auto; background-color: var(--bg-card); border-radius: var(--radius-md); min-height: 300px; box-shadow: var(--shadow-sm);">
<table id="ogrenci_tablosu" style="width: 100%; border-collapse: collapse; font-size: 12px; text-align: left;">
<thead style="position: sticky; top: 0; background-color: var(--bg-card-solid); z-index: 1; border-bottom: 1px solid var(--border);">
<tr>
<th style="width: 15%; padding: 10px 14px; color: var(--fg-main); font-weight: 600;">No</th>
<th style="width: 50%; padding: 10px 14px; color: var(--fg-main); font-weight: 600;">Ad Soyad</th>
<th style="width: 15%; padding: 10px 14px; color: var(--fg-main); font-weight: 600;">Sınıfı</th>
<th style="width: 20%; padding: 12px; border-bottom: 1px solid var(--border); text-align: center; color: var(--fg-sub);">İşlemler</th>
</tr>
</thead>
<tbody>
    <template x-for="ogr in gosterilecekOgrenciler" :key="ogr.no">
        <tr>
            <td style="padding: 12px; border-bottom: 1px solid var(--border); color: var(--fg-sub); font-weight:bold;" x-text="ogr.no"></td>
            <td style="padding: 12px; border-bottom: 1px solid var(--border); color: var(--fg-main); font-weight:bold;" x-text="ogr.ad_soyad"></td>
            <td style="padding: 12px; border-bottom: 1px solid var(--border); color: var(--fg-main);" x-text="ogr.sube"></td>
            <td style="padding: 12px; border-bottom: 1px solid var(--border); text-align: center;">
                <button class="icon-btn" style="color:var(--tree-sel);" @click="duzenle(ogr)" title="Düzenle"><i data-lucide="edit" width="16" height="16"></i></button>
                <button class="icon-btn" style="color:#EF4444;" @click="sil(ogr.no, ogr.ad_soyad)" title="Sil"><i data-lucide="trash-2" width="16" height="16"></i></button>
            </td>
        </tr>
    </template>
</tbody>
</table>
</div>
</div>
</div>
<script>
document.addEventListener("alpine:init", () => {
    Alpine.data("ogrenciYonetimComponent", () => ({
        arama: "",
        aktifFiltre: "Tümü",
        formAcik: false,
        duzenlenenOgrenci: { no: "", ad_soyad: "", sube: "", eski_no: "" },
        ogrenciler: window.ogrenciListesi || [],

        init() {
            window.addEventListener("ogrenciler-guncellendi", () => {
                this.ogrenciler = window.ogrenciListesi || [];
            });
        },
        
        get subeler() {
            let sList = [...new Set(this.ogrenciler.map(o => String(o.sube).trim()))];
            return sList.sort((a, b) => {
                let pa = parseInt(a); let pb = parseInt(b);
                if (!isNaN(pa) && !isNaN(pb)) return pa - pb;
                return a.localeCompare(b);
            });
        },
        
        get gosterilecekOgrenciler() {
            let filterText = this.arama.toLocaleUpperCase("tr-TR");
            let arr = [...this.ogrenciler].sort((a,b) => {
                let p1 = parseInt(a.sube)||99, p2 = parseInt(b.sube)||99;
                if(p1 !== p2) return p1 - p2;
                return a.ad_soyad.localeCompare(b.ad_soyad);
            });
            
            return arr.filter(o => {
                if(filterText && !o.ad_soyad.toLocaleUpperCase("tr-TR").includes(filterText) && !String(o.no).includes(filterText)) return false;
                if(this.aktifFiltre !== "Tümü" && String(o.sube).trim() !== this.aktifFiltre) return false;
                return true;
            });
        },
        
        yeniEkle() {
            this.duzenlenenOgrenci = { no: "", ad_soyad: "", sube: "", eski_no: "" };
            this.formAcik = true;
        },
        
        duzenle(ogr) {
            this.duzenlenenOgrenci = { no: ogr.no, ad_soyad: ogr.ad_soyad, sube: ogr.sube, eski_no: ogr.no };
            this.formAcik = true;
        },
        
        kaydet() {
            if(!this.duzenlenenOgrenci.no || !this.duzenlenenOgrenci.ad_soyad || !this.duzenlenenOgrenci.sube) {
                if(window.bildirimGoster) window.bildirimGoster("Lütfen tüm alanları doldurun.", "hata");
                return;
            }
            fetch(`${window.API || ''}/ogrenci-ekle-guncelle`, { 
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(this.duzenlenenOgrenci)
            })
            .then(r => r.json())
            .then(v => {
                if(window.bildirimGoster) window.bildirimGoster(v.mesaj, v.basarili ? "bilgi" : "hata");
                if (v.basarili) {
                    this.formAcik = false;
                    if(window.verileriYukle) window.verileriYukle();
                }
            })
            .catch(e => {
                if(window.bildirimGoster) window.bildirimGoster("Hata olustu: " + e, "hata");
            });
        },
        
        sil(no, ad) {
            if (!confirm(`${no} numaralı ${ad} adlı öğrenciyi (ve tüm devamsızlıklarını) silmek istediğinize emin misiniz?`)) return;
            fetch(`${window.API || ''}/ogrenci-sil/${encodeURIComponent(no)}`, { method: "DELETE" })
            .then(r => r.json())
            .then(v => {
                if(window.bildirimGoster) window.bildirimGoster(v.mesaj, v.basarili ? "bilgi" : "hata");
                if (v.basarili) {
                    if(window.verileriYukle) window.verileriYukle();
                }
            })
            .catch(e => {
                if(window.bildirimGoster) window.bildirimGoster("Hata olustu: " + e, "hata");
            });
        }
    }));
});
</script>
