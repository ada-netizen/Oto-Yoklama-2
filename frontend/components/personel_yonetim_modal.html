<div class="modal-overlay" id="personel_yonetim_modal" x-data="personelYonetimComponent()">
<div class="modal-content" style="width: 850px; max-width: 95vw; max-height: 90vh; display: flex; flex-direction: column; padding: 0; background-color: var(--bg-main);">
<div class="modal-header">
<h2 style="margin:0; color: var(--tree-sel); font-size: 16px; display:flex; align-items:center; gap:8px;">
<i data-lucide="users" height="16" width="16"></i> Personel Yönetimi (Alpine.js)
                </h2>
<div style="display: flex; gap: 8px; align-items: center;">
<button class="btn btn-kirmizi" onclick="personelPdfIndir()" style="padding: 5px 12px; display:flex; align-items:center; gap:5px;"><i data-lucide="file-text" height="16" width="16"></i> PDF</button>
<button class="btn btn-ogr" onclick="personelExcelIndir()" style="padding: 5px 12px; display:flex; align-items:center; gap:5px;"><i data-lucide="bar-chart" height="16" width="16"></i> Excel</button>
<button class="icon-btn" onclick="modalKapat('personel_yonetim_modal')" style="color: var(--fg-main);" title="Kapat"><i data-lucide="x" height="16" width="16"></i></button>
</div>
</div>
<div style="padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
<div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
<div class="input-with-icon" style="width: 220px;">
<i data-lucide="search" class="search-icon"></i>
<input class="search-input" x-model="arama" placeholder="Personel Ara..." type="text"/>
</div>
<div id="personel_filtre_cipleri" style="display: flex; gap: 6px;">
    <button class="filter-chip" :class="{'active': aktifFiltre === 'Tümü'}" @click="aktifFiltre = 'Tümü'">Tümü</button>
    <template x-for="grup in gruplar" :key="grup">
        <button class="filter-chip" :class="{'active': aktifFiltre === grup}" @click="aktifFiltre = grup" x-text="grup"></button>
    </template>
</div>
</div>
<div style="display: flex; gap: 10px;">
<button class="btn btn-dev" onclick="personelGrupYonetimiAc()" style="padding: 6px 15px; border-radius: 16px; display:flex; align-items:center; gap:5px;"><i data-lucide="users" height="16" width="16"></i> Grupları Yönet</button>
<button class="btn btn-ogr" onclick="personelDrawerAc()" style="padding: 6px 15px; border-radius: 16px; display:flex; align-items:center; gap:5px;"><i data-lucide="plus" height="16" width="16"></i> Yeni Personel</button>
</div>
</div>
<div class="tree-card" style="margin: 0 20px 20px 20px; flex: 1; border: 1px solid var(--border); overflow-y: auto; background-color: var(--bg-card); border-radius: 6px;">
<table id="personel_tablosu" style="width: 100%; border-collapse: collapse; font-size: 12px; text-align: left;">
<thead style="position: sticky; top: 0; background-color: var(--bg-main); z-index: 1;">
<tr>
<th style="width: 40%; padding: 12px; border-bottom: 1px solid var(--border); color: var(--fg-sub); cursor: pointer; user-select: none;" @click="sirala('ad')">
    <span style="font-weight: 700; color: var(--fg-main);" x-text="'Ad Soyad' + (siralamaSutun === 'ad' ? (siralamaYon === 1 ? ' ▲' : ' ▼') : ' ↕')"></span>
</th>
<th style="width: 25%; padding: 12px; border-bottom: 1px solid var(--border); color: var(--fg-sub); cursor: pointer; user-select: none;" @click="sirala('brans')">
    <span style="font-weight: 700; color: var(--fg-main);" x-text="'Branşı' + (siralamaSutun === 'brans' ? (siralamaYon === 1 ? ' ▲' : ' ▼') : ' ↕')"></span>
</th>
<th style="width: 20%; padding: 12px; border-bottom: 1px solid var(--border); color: var(--fg-sub); cursor: pointer; user-select: none;" @click="sirala('gorev')">
    <span style="font-weight: 700; color: var(--fg-main);" x-text="'Görevi' + (siralamaSutun === 'gorev' ? (siralamaYon === 1 ? ' ▲' : ' ▼') : ' ↕')"></span>
</th>
<th style="width: 15%; padding: 12px; border-bottom: 1px solid var(--border); text-align: center; color: var(--fg-sub);">İşlemler</th>
</tr>
</thead>
<tbody id="personel_govde">
    <template x-for="p in gosterilecekPersoneller" :key="p.ad">
        <tr>
            <td style="padding: 12px; border-bottom: 1px solid var(--border); color: var(--fg-main); font-weight:bold;" x-text="p.ad"></td>
            <td style="padding: 12px; border-bottom: 1px solid var(--border); color: var(--fg-main);" x-text="p.brans"></td>
            <td style="padding: 12px; border-bottom: 1px solid var(--border); color: var(--fg-sub); font-size:11px;" x-text="p.gorev"></td>
            <td style="padding: 12px; border-bottom: 1px solid var(--border); text-align: center;">
                <button class="icon-btn" style="color:var(--tree-sel);" @click="duzenle(p.ad)" title="Düzenle"><i data-lucide="edit" width="16" height="16"></i></button>
                <button class="icon-btn" style="color:#EF4444;" @click="sil(p.ad)" title="Sil"><i data-lucide="trash-2" width="16" height="16"></i></button>
            </td>
        </tr>
    </template>
</tbody>
</table>
</div>
</div>
</div>
<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('personelYonetimComponent', () => ({
        arama: '',
        aktifFiltre: 'Tümü',
        siralamaSutun: 'ad',
        siralamaYon: 1,
        personeller: [...(window.tumPersoneller || [])],
        gruplarVerisi: [...(window.tumPersonelGruplari || [])],
        
        init() {
            window.addEventListener('personeller-guncellendi', () => {
                this.personeller = [...(window.tumPersoneller || [])];
                this.gruplarVerisi = [...(window.tumPersonelGruplari || [])];
                this.$nextTick(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); });
            });
            this.$watch('aktifFiltre', () => {
                this.$nextTick(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); });
            });
            this.$watch('arama', () => {
                this.$nextTick(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); });
            });
            
            if (!window.tumPersonelGruplari) {
                fetch(`${window.API || 'http://127.0.0.1:8000'}/ayarlar-getir`).then(r => r.json()).then(v => {
                    let ayar = v.ayarlar || {};
                    window.tumPersonelGruplari = ayar.personel_gruplari || ['İdare', 'Öğretmenler', 'Diğer Personel'];
                    this.gruplarVerisi = [...window.tumPersonelGruplari];
                    window.dispatchEvent(new CustomEvent('personeller-guncellendi'));
                }).catch(e => console.error(e));
            }

            if (this.personeller.length === 0 && typeof personelleriYukle === 'function') {
                personelleriYukle();
            } else {
                this.$nextTick(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); });
            }
        },
        
        sirala(sutun) {
            if (this.siralamaSutun === sutun) {
                this.siralamaYon *= -1;
            } else {
                this.siralamaSutun = sutun;
                this.siralamaYon = 1;
            }
            this.$nextTick(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); });
        },
        
        get gruplar() {
            return this.gruplarVerisi;
        },
        
        get gosterilecekPersoneller() {
            let filterText = this.arama.toLocaleUpperCase('tr-TR');
            let arr = [...this.personeller];
            
            let filtered = arr.filter(p => {
                if(filterText && !p.ad.toLocaleUpperCase('tr-TR').includes(filterText)) return false;
                if(this.aktifFiltre !== 'Tümü' && p.grup !== this.aktifFiltre) return false;
                return true;
            });

            return filtered.sort((a, b) => {
                let valA = (a[this.siralamaSutun] || '').toString();
                let valB = (b[this.siralamaSutun] || '').toString();
                return valA.localeCompare(valB, 'tr-TR', { sensitivity: 'base' }) * this.siralamaYon;
            });
        },
        
        duzenle(ad) {
            if(window.personelDuzenleBaslat) window.personelDuzenleBaslat(ad);
        },
        
        async sil(ad) {
            const onay = await modernOnayGoster("Personel Silme Onayı", `${ad} adlı personeli silmek istediğinize emin misiniz?`, "uyari");
            if(!onay) return;
            apiFetch(`/personel-sil/${encodeURIComponent(ad)}`, { method: 'DELETE' })
            .then(v => {
                if(window.bildirimGoster) window.bildirimGoster(v.mesaj, v.basarili ? "bilgi" : "hata");
                if (v.basarili) {
                    // Update global state and trigger Alpine reactivity
                    if(window.tumPersoneller) {
                        window.tumPersoneller = window.tumPersoneller.filter(p => p.ad !== ad);
                    }
                    if(window.personelleriYukle) {
                        window.personelleriYukle();
                    }
                }
            })
            .catch(e => {
                if(window.bildirimGoster) window.bildirimGoster("Hata oluştu: " + e, "hata");
            });
        }
    }));
});
</script>
