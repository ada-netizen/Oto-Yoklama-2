<!-- ================= SOL NAVİGASYON & DURUM RAYI (SIDEBAR RAIL) ================= -->
<aside class="sidebar-rail" id="sidebar_rail">
    <!-- 1. OKUL & SİSTEM KİMLİĞİ -->
    <div class="sidebar-brand">
        <div class="sidebar-emblem">
            <i data-lucide="graduation-cap" height="22" width="22"></i>
        </div>
        <div class="sidebar-brand-text">
            <span class="sidebar-app-name">ELEKTRONİK OKUL</span>
        </div>
    </div>

    <!-- 2. ÇALIŞMA İSTASYONLARI & MODÜLLER (MANTIKSAL 4 KATEGORİ) -->
    <nav class="sidebar-nav">
        <!-- 1. KATEGORİ: ÖĞRENCİ İŞLEMLERİ -->
        <div class="sidebar-section-title" data-yetki-grup="ogrenci">ÖĞRENCİ İŞLEMLERİ</div>
        <button class="rail-btn tab-btn aktif" data-yetki="ogrenci" onclick="sekmeAc(event, 'sekme_izin')" title="Öğrenci İzin ve Devamsızlık İstasyonu (Ctrl+1)">
            <i data-lucide="calendar-check" height="18" width="18"></i>
            <span class="rail-label">İzin Dilekçesi</span>
        </button>
        <button class="rail-btn tab-btn" data-yetki="ogrenci" onclick="sekmeAc(event, 'sekme_dashboard'); dashboardYukle();" title="Proaktif Dashboard & İstatistikler (Ctrl+4)">
            <i data-lucide="pie-chart" height="18" width="18"></i>
            <span class="rail-label">İstatistikler</span>
        </button>

        <!-- 2. KATEGORİ: PERSONEL İŞLEMLERİ -->
        <div class="sidebar-section-title" data-yetki-grup="personel">PERSONEL İŞLEMLERİ</div>
        <button class="rail-btn tab-btn" data-yetki="teblig" onclick="sekmeAc(event, 'sekme_teblig')" title="Personel Tebliğ Masası (Ctrl+2)">
            <i data-lucide="users" height="18" width="18"></i>
            <span class="rail-label">Personel Tebliğ</span>
        </button>
        <button class="rail-btn tab-btn" data-yetki="terfi" onclick="sekmeAc(event, 'sekme_terfi'); if (typeof terfiYukle === 'function') terfiYukle();" title="Personel Terfi Takibi & 365 Günlük Takvim">
            <i data-lucide="award" height="18" width="18"></i>
            <span class="rail-label">Personel Terfi</span>
        </button>
        <button class="rail-btn tab-btn" data-yetki="izin" onclick="sekmeAc(event, 'sekme_saglik'); saglikYukle();" title="Personel İzin Masası & 365 Günlük Takvim (Ctrl+5)">
            <i data-lucide="calendar-heart" height="18" width="18"></i>
            <span class="rail-label">Personel İzin</span>
        </button>

        <!-- 3. KATEGORİ: DOĞRUDAN TEMİN -->
        <div class="sidebar-section-title" data-yetki-grup="ihale">DOĞRUDAN TEMİN</div>
        <button class="rail-btn tab-btn" data-yetki="ihale" onclick="sekmeAc(event, 'sekme_ihale')" title="22/d Doğrudan Temin & İhale Masası (Ctrl+3)">
            <i data-lucide="briefcase" height="18" width="18"></i>
            <span class="rail-label">22/d Satın Alma</span>
        </button>

        <!-- 4. KATEGORİ: SİSTEM & REHBER -->
        <div class="sidebar-section-title">SİSTEM & REHBER</div>
        <button class="rail-btn tab-btn" data-yetki="admin" onclick="sekmeAc(event, 'sekme_ayarlar')" title="Sistem Ayarları ve Yedekler (Ctrl+6)">
            <i data-lucide="sliders" height="18" width="18"></i>
            <span class="rail-label">Ayarlar & Yedek</span>
        </button>
        <button class="rail-btn tab-btn" id="btn_admin_paneli_sidebar" data-yetki="admin" onclick="adminPaneliAc()" title="Kullanıcı & Ağ Yönetim Paneli" style="display: none; color: #10b981;">
            <i data-lucide="shield-alert" height="18" width="18"></i>
            <span class="rail-label">Admin Paneli</span>
        </button>
        <button class="rail-btn tab-btn" onclick="sekmeAc(event, 'sekme_yardim')" title="Yardım ve Kılavuz (Ctrl+7)">
            <i data-lucide="help-circle" height="18" width="18"></i>
            <span class="rail-label">Yardım</span>
        </button>
        <button class="rail-btn tab-btn" onclick="sekmeAc(event, 'sekme_iletisim')" title="Geri Bildirim ve İletişim">
            <i data-lucide="message-square" height="18" width="18"></i>
            <span class="rail-label">İletişim & Geri Bildirim</span>
        </button>
    </nav>

    <!-- 3. CANLI SİSTEM NABZI & POWER-USER BUTONLARI -->
    <div class="sidebar-footer">
        <div class="sidebar-power-actions">
            <button class="cmd-palette-trigger-btn sidebar-action-btn" onclick="komutPaletiAc()" title="Evrensel Komut Paleti (Ctrl + K)">
                <i data-lucide="command" height="14" width="14"></i>
                <span>Komutlar</span>
                <kbd>Ctrl K</kbd>
            </button>
            <button class="cmd-palette-trigger-btn sidebar-action-btn" onclick="modalAc('kisayollar_modal')" title="Klavye Kısayolları Rehberi (F1)">
                <i data-lucide="keyboard" height="14" width="14"></i>
                <span>Kısayol</span>
                <kbd>F1</kbd>
            </button>
        </div>

        <div class="sidebar-pulse-row">
            <div class="sidebar-status-indicator" title="SQLite Veritabanı ve Yerel Motor Aktif">
                <span class="pulse-dot"></span>
                <span class="pulse-text">60 FPS • SQLite</span>
            </div>
            <div class="tema-switch" id="btn_tema" onclick="temaDegistir()" title="Aydınlık / Karanlık Mod (WCAG AA)">
                <div class="switch-top"></div>
                <span class="ay"><i data-lucide="moon" height="11" width="11"></i></span>
                <span class="gunes"><i data-lucide="sun" height="11" width="11"></i></span>
            </div>
        </div>

        <!-- 4. KULLANICI PROFİL KARTI & ÇIKIŞ (Gece/Gündüz Modunun Hemen Altında) -->
        <div class="sidebar-user-card" id="sidebar_user_card" style="display: none;">
            <div class="sidebar-user-profile-row">
                <div class="sidebar-user-avatar" id="sidebar_user_avatar" title="Kullanıcı Profili">
                    ?
                </div>
                <div class="sidebar-user-text-info">
                    <div id="sidebar_user_name" class="sidebar-user-name" title="Kullanıcı">Kullanıcı</div>
                    <div id="sidebar_user_role" class="sidebar-user-role">Rol</div>
                </div>
            </div>
            <div class="sidebar-user-action-buttons">
                <button type="button" class="btn btn-sidebar-user-action" onclick="authSifreDegistirModalAc()" title="Şifremi Değiştir">
                    <i data-lucide="key" height="12" width="12"></i>
                    <span>Şifre</span>
                </button>
                <button type="button" class="btn btn-sidebar-user-logout" onclick="authOturumKapat()" title="Güvenli Çıkış Yap">
                    <i data-lucide="log-out" height="12" width="12"></i>
                    <span>Çıkış</span>
                </button>
            </div>
        </div>
    </div>
</aside>
