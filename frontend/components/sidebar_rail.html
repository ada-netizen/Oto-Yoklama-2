<!-- ================= SOL NAVİGASYON & DURUM RAYI (SIDEBAR RAIL) ================= -->
<aside class="sidebar-rail" id="sidebar_rail">
    <!-- 1. OKUL & SİSTEM KİMLİĞİ -->
    <div class="sidebar-brand">
        <div class="sidebar-emblem">
            <i data-lucide="graduation-cap" height="22" width="22"></i>
        </div>
        <div class="sidebar-brand-text">
            <span class="sidebar-app-name">ELEKTRONİK OKUL</span>
        </div>
    </div>

    <!-- 2. ÇALIŞMA İSTASYONLARI & MODÜLLER (MANTIKSAL 4 KATEGORİ) -->
    <nav class="sidebar-nav">
        <!-- 1. KATEGORİ: ÖĞRENCİ İŞLEMLERİ -->
        <div class="sidebar-section-title">ÖĞRENCİ İŞLEMLERİ</div>
        <button class="rail-btn tab-btn aktif" onclick="sekmeAc(event, 'sekme_izin')" title="Öğrenci İzin ve Devamsızlık İstasyonu (Ctrl+1)">
            <i data-lucide="calendar-check" height="18" width="18"></i>
            <span class="rail-label">İzin Dilekçesi</span>
        </button>
        <button class="rail-btn tab-btn" onclick="sekmeAc(event, 'sekme_dashboard'); dashboardYukle();" title="Proaktif Dashboard & İstatistikler (Ctrl+4)">
            <i data-lucide="pie-chart" height="18" width="18"></i>
            <span class="rail-label">İstatistikler</span>
        </button>

        <!-- 2. KATEGORİ: PERSONEL İŞLEMLERİ -->
        <div class="sidebar-section-title">PERSONEL İŞLEMLERİ</div>
        <button class="rail-btn tab-btn" onclick="sekmeAc(event, 'sekme_teblig')" title="Personel Tebliğ Masası (Ctrl+2)">
            <i data-lucide="users" height="18" width="18"></i>
            <span class="rail-label">Personel Tebliğ</span>
        </button>
        <button class="rail-btn tab-btn" onclick="sekmeAc(event, 'sekme_saglik'); saglikYukle();" title="Personel Sağlık İzinleri (Ctrl+5)">
            <i data-lucide="activity" height="18" width="18"></i>
            <span class="rail-label">Sağlık İzinleri</span>
        </button>

        <!-- 3. KATEGORİ: DOĞRUDAN TEMİN -->
        <div class="sidebar-section-title">DOĞRUDAN TEMİN</div>
        <button class="rail-btn tab-btn" onclick="sekmeAc(event, 'sekme_ihale')" title="22/d Doğrudan Temin & İhale Masası (Ctrl+3)">
            <i data-lucide="briefcase" height="18" width="18"></i>
            <span class="rail-label">22/d Satın Alma</span>
        </button>

        <!-- 4. KATEGORİ: SİSTEM & REHBER -->
        <div class="sidebar-section-title">SİSTEM & REHBER</div>
        <button class="rail-btn tab-btn" onclick="sekmeAc(event, 'sekme_ayarlar')" title="Sistem Ayarları ve Yedekler (Ctrl+6)">
            <i data-lucide="sliders" height="18" width="18"></i>
            <span class="rail-label">Ayarlar & Yedek</span>
        </button>
        <button class="rail-btn tab-btn" onclick="sekmeAc(event, 'sekme_yardim')" title="Yardım ve Kılavuz (Ctrl+7)">
            <i data-lucide="help-circle" height="18" width="18"></i>
            <span class="rail-label">Yardım</span>
        </button>
        <button class="rail-btn tab-btn" onclick="sekmeAc(event, 'sekme_iletisim')" title="Geri Bildirim ve İletişim">
            <i data-lucide="message-square" height="18" width="18"></i>
            <span class="rail-label">İletişim & Geri Bildirim</span>
        </button>
    </nav>

    <!-- 3. CANLI SİSTEM NABZI & POWER-USER BUTONLARI -->
    <div class="sidebar-footer">
        <div class="sidebar-power-actions">
            <button class="cmd-palette-trigger-btn sidebar-action-btn" onclick="komutPaletiAc()" title="Evrensel Komut Paleti (Ctrl + K)">
                <i data-lucide="command" height="14" width="14"></i>
                <span>Komutlar</span>
                <kbd>Ctrl K</kbd>
            </button>
            <button class="cmd-palette-trigger-btn sidebar-action-btn" onclick="modalAc('kisayollar_modal')" title="Klavye Kısayolları Rehberi (F1)">
                <i data-lucide="keyboard" height="14" width="14"></i>
                <span>Kısayol</span>
                <kbd>F1</kbd>
            </button>
        </div>

        <div class="sidebar-pulse-row">
            <div class="sidebar-status-indicator" title="SQLite Veritabanı ve Yerel Motor Aktif">
                <span class="pulse-dot"></span>
                <span class="pulse-text">60 FPS • SQLite</span>
            </div>
            <div class="tema-switch" id="btn_tema" onclick="temaDegistir()" title="Aydınlık / Karanlık Mod (WCAG AA)">
                <div class="switch-top"></div>
                <span class="ay"><i data-lucide="moon" height="11" width="11"></i></span>
                <span class="gunes"><i data-lucide="sun" height="11" width="11"></i></span>
            </div>
        </div>
    </div>
</aside>
