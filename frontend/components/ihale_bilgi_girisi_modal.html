<div class="modal-overlay" id="ihale_bilgi_girisi_modal" style="z-index:4000; align-items:center; justify-content:center;" x-data="ihaleBilgiComponent()" x-show="acik" style="display: none;">
<div class="modal-content" style="width: 95%; max-width: 500px; padding: 0; background-color: var(--bg-main); display: flex; flex-direction: column;">
<div class="modal-header">
<h2 style="margin:0; color: var(--tree-sel); font-size: 16px; display:flex; align-items:center; gap:8px;">
<i data-lucide="info" height="18" width="18"></i> İhale Bilgi Girişi (Alpine.js)
                </h2>
<button class="btn btn-kirmizi" @click="acik = false" style="padding: 5px 15px;">Kapat</button>
</div>
<div style="padding: 15px 20px; overflow-y: auto;">
<div style="margin-bottom: 15px;">
<label style="font-size: 12px; font-weight: bold; color: var(--fg-main); margin-bottom: 5px; display: block;">Resmi Yazı Başlığı</label>
<textarea x-model="baslik" placeholder="Örn: T.C.\nBİNGÖL VALİLİĞİ\nOkul Müdürlüğü" rows="3" style="width: 100%; padding: 8px; background: var(--bg-input); color: var(--fg-main); border: 1px solid var(--border); border-radius: 4px; resize: vertical;"></textarea>
</div>
<div style="margin-bottom: 15px;">
<label style="font-size: 12px; font-weight: bold; color: var(--fg-main); margin-bottom: 5px; display: block;">Yazışma Kod Numarası</label>
<input x-model="kod" placeholder="Örn: 12345678-903.02.01" style="width: 100%; padding: 8px; background: var(--bg-input); color: var(--fg-main); border: 1px solid var(--border); border-radius: 4px;" type="text"/>
</div>
</div>
<div style="padding: 15px 20px; background-color: var(--bg-card); border-top: 1px solid var(--border); text-align: right;">
<button class="btn btn-dev" @click="kaydet()" style="padding: 10px 20px; font-weight:bold; border-radius:6px; background-color:#10B981;"><i data-lucide="save" height="16" width="16"></i> Kaydet</button>
</div>
</div>
</div>
<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('ihaleBilgiComponent', () => ({
        acik: false,
        baslik: '',
        kod: '',
        
        init() {
            window.ihaleBilgiGirisModalAc = () => {
                this.baslik = window.ihaleGeciciVeri?.resmi_baslik || localStorage.getItem("ihale_resmi_baslik") || "";
                this.kod = window.ihaleGeciciVeri?.yazisma_kodu || localStorage.getItem("ihale_yazisma_kodu") || "";
                this.acik = true;
            };
        },
        
        kaydet() {
            if(window.ihaleGeciciVeri) {
                window.ihaleGeciciVeri.resmi_baslik = this.baslik;
                window.ihaleGeciciVeri.yazisma_kodu = this.kod;
            }
            localStorage.setItem("ihale_resmi_baslik", this.baslik);
            localStorage.setItem("ihale_yazisma_kodu", this.kod);
            
            if(window.ihaleTaslaginiKaydet) window.ihaleTaslaginiKaydet();
            this.acik = false;
            if(window.bildirimGoster) window.bildirimGoster("Bilgiler kaydedildi.", "basari");
        }
    }));
});
</script>
