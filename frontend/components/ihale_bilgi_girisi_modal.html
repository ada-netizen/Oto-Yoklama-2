<div class="modal-overlay" id="ihale_bilgi_girisi_modal" style="z-index: 4000; align-items: center; justify-content: center; display: none;">
    <div class="modal-content" style="width: 95%; max-width: 500px; padding: 0; background-color: var(--bg-main); display: flex; flex-direction: column; border-radius: 12px; border: 1px solid var(--border); overflow: hidden; box-shadow: var(--shadow-xl);">
        <div class="modal-header" style="padding: 14px 18px; border-bottom: 1px solid var(--border); background-color: var(--bg-card); display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin: 0; color: var(--tree-sel); font-size: 16px; display: flex; align-items: center; gap: 8px;">
                <i data-lucide="info" height="18" width="18"></i> İhale Bilgi Girişi
            </h2>
            <button class="btn btn-temizle" onclick="ihaleBilgiGirisiModalKapat()" style="padding: 4px 10px; font-size: 12px;">Kapat</button>
        </div>
        <div style="padding: 15px 20px; overflow-y: auto;">
            <div style="margin-bottom: 15px;">
                <label style="font-size: 12px; font-weight: bold; color: var(--fg-main); margin-bottom: 5px; display: block;">Resmi Yazı Başlığı</label>
                <textarea id="modal_ihale_resmi_baslik" placeholder="Örn: T.C.&#10;BİNGÖL VALİLİĞİ&#10;Okul Müdürlüğü" rows="3" style="width: 100%; box-sizing: border-box; padding: 8px 10px; background: var(--bg-input, var(--bg-card)); color: var(--fg-main); border: 1px solid var(--border); border-radius: 6px; resize: vertical; font-size: 12.5px;"></textarea>
            </div>
            <div style="margin-bottom: 15px;">
                <label style="font-size: 12px; font-weight: bold; color: var(--fg-main); margin-bottom: 5px; display: block;">Yazışma Kod Numarası</label>
                <input id="modal_ihale_yazisma_kodu" placeholder="Örn: 12345678-903.02.01" style="width: 100%; box-sizing: border-box; padding: 8px 10px; background: var(--bg-input, var(--bg-card)); color: var(--fg-main); border: 1px solid var(--border); border-radius: 6px; font-size: 12.5px;" type="text"/>
            </div>
        </div>
        <div style="padding: 12px 20px; background-color: var(--bg-card); border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px;">
            <button class="btn btn-temizle" onclick="ihaleBilgiGirisiModalKapat()" style="padding: 8px 16px; font-size: 12px;">İptal</button>
            <button class="btn btn-dev" onclick="ihaleBilgiGirisiKaydet()" style="padding: 8px 18px; font-weight: bold; border-radius: 6px; background-color: #10B981; color: white; border: none; display: flex; align-items: center; gap: 6px; cursor: pointer;"><i data-lucide="save" height="15" width="15"></i> Kaydet</button>
        </div>
    </div>
</div>
