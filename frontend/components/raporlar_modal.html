<div class="modal-overlay" id="raporlar_modal" x-data="raporlarComponent()">
<div class="modal-content" style="width: 700px; padding: 0; background-color: var(--bg-main);">
<div class="modal-header">
<h2 style="margin:0; color: var(--tree-sel); font-size: 16px;">Raporlar (Alpine.js)</h2>
<button class="btn btn-kirmizi" onclick="modalKapat('raporlar_modal')" style="padding: 5px 15px;">Kapat</button>
</div>
<div style="padding: 20px; display: flex; flex-direction: column; gap: 12px;">
<!-- Chart.js: Devamsizlik Ozeti -->
<div style="background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 15px;">
<div style="font-size: 12px; font-weight: bold; color: var(--fg-sub); margin-bottom: 10px;">Ş/S Sınıf Bazlı Devamsızlık Özeti</div>
<canvas height="120" id="devamsizlik_chart"></canvas>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; background-color: var(--bg-card); padding: 15px; border: 1px solid var(--border); border-radius: 4px;">
<span style="color: var(--fg-main); font-weight: bold; font-size: 12px;">Özürsüz Sınırını Aşanlar (10+ Gün)</span>
<div style="display:flex; gap:5px;">
<button class="btn btn-ogr" @click="rapor('ozursuz','excel')" style="padding: 6px 15px;">Excel</button>
<button class="btn btn-kirmizi" @click="rapor('ozursuz','pdf')" style="padding: 6px 15px;">PDF</button>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; background-color: var(--bg-card); padding: 15px; border: 1px solid var(--border); border-radius: 4px;">
<span style="color: var(--fg-main); font-weight: bold; font-size: 12px;">Sınıf Bazlı Devamsızlık Eşik Raporu</span>
<div style="display:flex; gap:5px;">
<button class="btn btn-ogr" @click="esikRaporu('excel')" style="padding: 6px 15px;">Excel</button>
<button class="btn btn-kirmizi" @click="esikRaporu('pdf')" style="padding: 6px 15px;">PDF</button>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; background-color: var(--bg-card); padding: 15px; border: 1px solid var(--border); border-radius: 4px;">
<span style="color: var(--fg-main); font-weight: bold; font-size: 12px;">Özürlü Sınırını Aşanlar (20+ Gün)</span>
<div style="display:flex; gap:5px;">
<button class="btn btn-ogr" @click="rapor('ozurlu','excel')" style="padding: 6px 15px;">Excel</button>
<button class="btn btn-kirmizi" @click="rapor('ozurlu','pdf')" style="padding: 6px 15px;">PDF</button>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; background-color: var(--bg-card); padding: 15px; border: 1px solid var(--border); border-radius: 4px;">
<div style="display: flex; align-items: center; gap: 8px;">
<span style="color: var(--fg-main); font-weight: bold; font-size: 12px;">Özürsüz Devamsızlığı</span>
<select x-model="gun_siniri" style="padding: 4px; background: var(--bg-main); color: var(--fg-main); border: 1px solid var(--border); font-weight: bold;">
<option value="">Seç</option>
<option value="5">5 Gün</option>
<option value="6">6 Gün</option>
<option value="7">7 Gün</option>
<option value="8">8 Gün</option>
<option value="9">9 Gün</option>
</select>
<span style="color: var(--fg-main); font-weight: bold; font-size: 12px;">ve Üstü Olanlar</span>
</div>
<div style="display:flex; gap:5px;">
<button class="btn btn-ogr" @click="rapor('gun_siniri','excel', gun_siniri)" style="padding: 6px 15px;">Excel</button>
<button class="btn btn-kirmizi" @click="rapor('gun_siniri','pdf', gun_siniri)" style="padding: 6px 15px;">PDF</button>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; background-color: var(--bg-card); padding: 15px; border: 1px solid var(--border); border-radius: 4px;">
<div style="display: flex; align-items: center; gap: 8px;">
<select x-model="sube" style="padding: 4px; background: var(--bg-main); color: var(--fg-main); border: 1px solid var(--border); font-weight: bold;">
<option value="">Seç</option>
<template x-for="s in subeler" :key="s">
    <option :value="s" x-text="s"></option>
</template>
</select>
<span style="color: var(--fg-main); font-weight: bold; font-size: 12px;">Şubesi Özürsüz Devamsızlık Listesi</span>
</div>
<div style="display:flex; gap:5px;">
<button class="btn btn-ogr" @click="rapor('sube_bazli','excel', sube)" style="padding: 6px 15px;">Excel</button>
<button class="btn btn-kirmizi" @click="rapor('sube_bazli','pdf', sube)" style="padding: 6px 15px;">PDF</button>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; background-color: var(--bg-card); padding: 15px; border: 1px solid var(--border); border-radius: 4px;">
<div style="display: flex; align-items: center; gap: 8px;">
<input x-model="tarih" placeholder="GG/AA/YYYY" style="width: 90px; padding: 4px; background: var(--bg-main); color: var(--fg-main); border: 1px solid var(--border); font-weight: bold;" type="text"/>
<span style="color: var(--fg-main); font-weight: bold; font-size: 12px;">Tarihinde Özürsüz Devamsızlık Yapanlar</span>
</div>
<div style="display:flex; gap:5px;">
<button class="btn btn-ogr" @click="rapor('tarih_bazli','excel', tarih)" style="padding: 6px 15px;">Excel</button>
<button class="btn btn-kirmizi" @click="rapor('tarih_bazli','pdf', tarih)" style="padding: 6px 15px;">PDF</button>
</div>
</div>
</div>
</div>
</div>
<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('raporlarComponent', () => ({
        gun_siniri: '',
        sube: '',
        tarih: '',
        
        get subeler() {
            if(!window.ogrenciListesi) return [];
            const subelerArr = [...new Set(window.ogrenciListesi.map(o => window.sinifFormatla ? window.sinifFormatla(o.sube) : o.sube))];
            return subelerArr.sort((a, b) => (parseInt(a)||99) - (parseInt(b)||99));
        },
        
        rapor(tur, format, ozelDeger) {
            if(window.raporAl) window.raporAl(tur, format, ozelDeger);
        },
        esikRaporu(format) {
            if(window.esikRaporuAl) window.esikRaporuAl(format);
        }
    }));
});
</script>
