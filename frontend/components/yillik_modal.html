<div class="modal-overlay" id="yillik_modal">
<div class="modal-content" style="width: 1140px; padding: 0; background-color: var(--bg-main);">
<div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border);">
    <div style="display: flex; align-items: center; gap: 12px;">
        <h2 id="modal_baslik" style="margin:0; color: var(--tree-sel); font-size: 16px; font-weight: 700;">Yıllık Devamsızlık Karnesi</h2>
        <button class="quick-action-btn whatsapp" onclick="veliWhatsAppKopyala()" style="padding: 4px 10px; font-size: 11px; display: inline-flex; align-items: center; gap: 5px; border-radius: 4px;" title="Veliye resmi bilgilendirme metnini panoya kopyala">
            <i data-lucide="message-circle" height="13" width="13"></i> WhatsApp Metni
        </button>
    </div>
    <button class="btn btn-kirmizi" onclick="modalKapat('yillik_modal')" style="padding: 5px 15px;">Kapat</button>
</div>
<div style="padding: 16px 20px; display: flex; flex-direction: column; gap: 12px;">
    <!-- ÇEŞİTLENDİRİLMİŞ AKILLI DEVAMSIZLIK ROZETLERİ -->
    <div id="yillik_rozetler_alani" style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); min-height: 40px;">
        <!-- JS ile dinamik doldurulacak -->
    </div>

    <div style="overflow-x: auto; background-color: var(--bg-card); padding: 10px; border: 1px solid var(--border); border-radius: 4px;">
    <table style="width: 100%; border-collapse: collapse; text-align: center; font-size: 11px;">
    <thead id="yillik_thead"></thead>
    <tbody id="yillik_tbody"></tbody>
    </table>
    </div>
    <div id="yillik_ozet_alani" style="display: flex; gap: 15px; justify-content: center;">
    </div>
</div>
</div>
</div>
